
services:
  postgres:
    image: postgres:15
    container_name: game_community_postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/marketPlace/setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - ./backend/user/setup.sql:/docker-entrypoint-initdb.d/02-user-setup.sql
    networks:
      - game_community_network

  redis:
    image: redis:7-alpine
    container_name: game_community_redis
    ports:
      - "6379:6379"
    networks:
      - game_community_network

volumes:
  postgres_data:

networks:
  game_community_network:
    driver: bridge
